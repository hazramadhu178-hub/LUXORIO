<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxorio — Luxury Beachside Resort</title>

    <!-- Apply the saved theme before anything paints (no colour flash),
         and mark the page as loading so the preloader can lock scrolling. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("luxorio-theme");
          if (saved === "light" || saved === "warm" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* localStorage may be unavailable */
        }
        document.documentElement.classList.add("is-loading");
      })();
    </script>

    <!-- Fonts: Fraunces (elegant serif for headings) + Inter (clean body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Preloader styles live here (not in index.css) so they apply instantly,
         before the app's stylesheet and JavaScript have loaded.
         Colours use the theme variables, with fallbacks for the very first paint. -->
    <style>
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--white, #ffffff);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      .preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-inner { text-align: center; }

      /* Palm logo inside a spinning gold ring */
      .preloader-mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        color: var(--gold, #e5ac1e);
      }
      .preloader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--card-border, #eef3f1);
        border-top-color: var(--gold, #e5ac1e);
        animation: preloader-spin 1.1s linear infinite;
      }
      .preloader-mark svg {
        width: 40px;
        height: 40px;
        transform-origin: 50% 90%;
        animation: preloader-sway 2.4s ease-in-out infinite;
      }

      /* Wordmark + tagline */
      .preloader-word {
        margin: 0;
        padding-left: 0.32em; /* balances the letter-spacing so it stays centred */
        font-family: "Fraunces", Georgia, serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: var(--ink, #12322c);
        animation: preloader-fade 0.9s ease both;
      }
      .preloader-tag {
        margin: 6px 0 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted, #5e736d);
        animation: preloader-fade 0.9s 0.15s ease both;
      }

      /* Thin gold loading bar */
      .preloader-bar {
        display: block;
        width: 140px;
        height: 2px;
        margin: 22px auto 0;
        border-radius: 2px;
        background: var(--card-border, #eef3f1);
        overflow: hidden;
      }
      .preloader-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--gold, #e5ac1e);
        animation: preloader-slide 1.2s ease-in-out infinite;
      }

      /* Screen-reader-only text */
      .preloader-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* While loading: no scrolling, and hold the hero entrance animation
         so it plays after the preloader fades instead of hidden behind it. */
      html.is-loading,
      html.is-loading body { overflow: hidden; }
      html.is-loading .hero-content { animation-play-state: paused; }

      @keyframes preloader-spin { to { transform: rotate(360deg); } }
      @keyframes preloader-sway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }
      @keyframes preloader-fade { from { opacity: 0; transform: translateY(8px); } }
      @keyframes preloader-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-ring,
        .preloader-mark svg,
        .preloader-bar span,
        .preloader-word,
        .preloader-tag { animation: none; }
      }
    </style>

    <!-- Without JavaScript the preloader could never be dismissed, so hide it. -->
    <noscript>
      <style>
        .preloader { display: none; }
        html.is-loading, html.is-loading body { overflow: auto; }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Preloader: shown instantly, removed by hidePreloader() in src/utils/preloader.ts -->
    <div id="preloader" class="preloader" role="status" aria-live="polite">
      <div class="preloader-inner">
        <div class="preloader-mark">
          <span class="preloader-ring"></span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13 8c0-2.76-2.46-5-5.5-5S2 5.24 2 8h2l1-1 1 1h4" />
            <path d="M13 7.14A5.82 5.82 0 0 1 16.5 6c3.04 0 5.5 2.24 5.5 5h-3l-1-1-1 1h-3" />
            <path d="M5.89 9.71c-2.15 2.15-2.3 5.47-.35 7.43l4.24-4.25.7-.7.71-.71 2.12-2.12c-1.95-1.96-5.27-1.8-7.42.35" />
            <path d="M11 15.5c.5 2.5-.17 4.5-1 6.5h4c2-5.5-.5-12-1-14" />
          </svg>
        </div>
        <p class="preloader-word">LUXORIO</p>
        <p class="preloader-tag">Beachside Luxury Resort</p>
        <span class="preloader-bar"><span></span></span>
        <span class="preloader-sr">Loading Luxorio...</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
